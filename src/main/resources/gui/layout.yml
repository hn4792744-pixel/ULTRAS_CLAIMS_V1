# Slot positions (0-based) of the claim management menu. 3 rows = slots 0-26.
main:
  slots:
    border: 10
    members: 11
    settings: 12
    cabin: 13
    map: 14
    notifications: 15
    info: 16
    close: 22

# Item shown for each icon id (any Minecraft item name). Works without a resource pack.
icons:
  border: LIME_STAINED_GLASS_PANE
  members: PLAYER_HEAD
  settings: COMPARATOR
  cabin: CHEST
  map: MAP
  notifications: BELL
  info: BOOK
  close: BARRIER
  back: ARROW
  confirm: LIME_DYE
  cancel: RED_DYE
  next: SPECTRAL_ARROW
  previous: SPECTRAL_ARROW
  toggle-on: LIME_DYE
  toggle-off: RED_DYE
